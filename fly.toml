# fly.toml app configuration file generated for mediaflow-proxy-ybseug on 2026-11-02T21:39:02Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mediaflow-proxy-ybseug'
primary_region = 'ams'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
